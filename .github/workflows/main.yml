                (zones.orange || []).forEach(z => { colorMap[z] = '#f97316'; });
                (zones.red || []).forEach(z => { colorMap[z] = '#ef4444'; });
                const c = (zone) => colorMap[zone] || '#2b2b33';
                const op = (zone) => colorMap[zone] ? '0.96' : '0.68';
                const uid = `${ex ? ex.id : 'ex'}_${detailed ? 'lg' : 'sm'}`;
