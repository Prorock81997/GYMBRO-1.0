          </head>
          <body class="min-h-screen flex justify-center items-stretch">
            <div id="app-shell" class="w-full max-w-[460px] h-[100dvh] flex flex-col relative overflow-hidden sm:border-x shadow-2xl">
              <div id="minimized-workout-bar" class="hidden shrink-0 z-30"></div>
              <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden no-scrollbar pb-24"></main>
              <nav id="tab-bar" class="shrink-0 backdrop-blur-xl border-t px-2 pt-2 pb-safe z-30"></nav>
              <div id="modal-root" class="hidden fixed inset-0 z-50 flex justify-center"></div>
              <div id="toast-root" class="pointer-events-none fixed top-4 left-1/2 -translate-x-1/2 z-[60] w-[92%] max-w-[420px] flex flex-col gap-2"></div>
            </div>
            <script>
              const MONTHS_RU = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
              const MONTHS_GENITIVE_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
              const WEEKDAYS_SHORT_RU = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

              function toDateKey(dateObj) { return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`; }
              function parseDateKey(key) { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); }
              function getTodayKey() { return toDateKey(new Date()); }
              function formatHumanDate(key) { const d = parseDateKey(key); return `${d.getDate()} ${MONTHS_GENITIVE_RU[d.getMonth()]} ${d.getFullYear()}`; }
              function formatRelativeDate(key) {
                const todayKey = getTodayKey();
                if (key === todayKey) return 'Сегодня';
                const diffDays = Math.round((parseDateKey(key) - parseDateKey(todayKey)) / 86400000);
                if (diffDays === -1) return 'Вчера';
                if (diffDays === 1) return 'Завтра';
                const t = parseDateKey(key);
                return `${t.getDate()} ${MONTHS_GENITIVE_RU[t.getMonth()]}`;
              }
              function formatDuration(minutes) {
                const mins = Math.max(0, Math.round(Number(minutes) || 0));
                if (mins < 60) return `${mins} мин`;
                const h = Math.floor(mins / 60), m = mins % 60;
                return m === 0 ? `${h} ч` : `${h} ч ${m} мин`;
              }
              function formatTimerSeconds(totalSec) {
                const s = Math.max(0, Math.floor(totalSec));
                return `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
              }
              function pluralize(n, one, few, many) {
                const abs = Math.abs(n) % 100, n1 = abs % 10;
                if (abs > 10 && abs < 20) return many;
                if (n1 > 1 && n1 < 5) return few;
                if (n1 === 1) return one;
                return many;
              }
              function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              }
              function generateId(prefix = 'id') { return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`; }

              function icon(name, cls = 'w-5 h-5') {
                const icons = {
                  home: `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9 20v-6h6v6"/></svg>`,
