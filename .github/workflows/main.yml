name: Build Gymbro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Gradle 8.7
        run: |
          set +o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" 2>/dev/null | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate Gymbro Android Project
        run: |
          python3 -c '
          from pathlib import Path

          def write_file(rel, text):
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text.lstrip("\n"), encoding="utf-8", newline="\n")

          write_file("settings.gradle", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Gymbro"
          include ":app"
          """)

          write_file("build.gradle", """
          plugins {
              id "com.android.application" version "8.5.2" apply false
          }
          """)

          write_file("gradle.properties", """
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          """)

          write_file("app/build.gradle", """
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.gymbro.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.gymbro.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          """)

          write_file("app/src/main/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="mailto" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          """)

          write_file("app/src/main/res/values/strings.xml", """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Gymbro</string>
          </resources>
          """)

          write_file("app/src/main/res/values/styles.xml", """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#09090B</item>
                  <item name="android:statusBarColor">#09090B</item>
                  <item name="android:navigationBarColor">#09090B</item>
              </style>
          </resources>
          """)

          write_file("app/src/main/res/drawable/ic_launcher_background.xml", """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#09090B"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          """)

          write_file("app/src/main/res/drawable/ic_launcher_foreground.xml", """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#A3E635"
                  android:pathData="M34,38h6v32h-6zM68,38h6v32h-6zM26,44h5v20h-5zM77,44h5v20h-5zM40,51h28v6h-28z" />
          </vector>
          """)

          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          """
          write_file("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", adaptive_xml)
          write_file("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", adaptive_xml)

          legacy_xml = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#09090B"
                  android:pathData="M18,0h72a18,18 0,0 1,18 18v72a18,18 0,0 1,-18 18h-72a18,18 0,0 1,-18 -18v-72a18,18 0,0 1,18 -18z" />
              <path
                  android:fillColor="#A3E635"
                  android:pathData="M34,38h6v32h-6zM68,38h6v32h-6zM26,44h5v20h-5zM77,44h5v20h-5zM40,51h28v6h-28z" />
          </vector>
          """
          write_file("app/src/main/res/mipmap-anydpi/ic_launcher.xml", legacy_xml)
          write_file("app/src/main/res/mipmap-anydpi/ic_launcher_round.xml", legacy_xml)

          write_file("app/src/main/java/com/gymbro/app/MainActivity.java", """package com.gymbro.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(0xFF09090B);
                  getWindow().setNavigationBarColor(0xFF09090B);

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF09090B);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUri(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUri(Uri.parse(url));
                      }
                  });

                  setContentView(webView);
                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              private boolean handleExternalUri(Uri uri) {
                  if (uri == null) return false;
                  if ("file".equalsIgnoreCase(uri.getScheme())) return false;
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                      return true;
                  } catch (Exception e) {
                      return true;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """)

          index_html = """<!DOCTYPE html>
          <html lang="ru" class="dark" data-theme="default">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
