                      ${!isExercisesSub ? `<button onclick="openManualWorkoutModal()" class="px-3.5 py-2 rounded-2xl bg-[#18181b] hover:bg-zinc-800 border border-zinc-800 text-xs font-bold text-lime-400 flex items-center gap-1.5 active:scale-95 transition">${icon('plus', 'w-4 h-4')}<span>Вписать</span></button>` : `<button onclick="openPresetEditorModal()" class="px-3.5 py-2 rounded-2xl bg-[#18181b] hover:bg-zinc-800 border border-zinc-800 text-xs font-bold text-lime-400 flex items-center gap-1.5 active:scale-95 transition">${icon('plus', 'w-4 h-4')}<span>Свой сет</span></button>`}
                    </div>
                    <div class="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-[#18181b] border border-zinc-800/90">
