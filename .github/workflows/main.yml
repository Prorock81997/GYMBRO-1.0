              function selectExerciseFromPicker(id) {
                const ex = getExerciseById(id); if (!ex) return;
                if (pickerContext === "active" && state.activeWorkout) {
                  state.activeWorkout.exercises.push({ id: generateId("aw_ex"), exerciseId: ex.id, name: ex.name, category: ex.category, weight: ex.defaultWeight, sets: ex.defaultSets, reps: ex.defaultReps, done: false });
                  saveState(); showToast(`Добавлено: ${ex.name}`); closeExercisePicker();
                } else if (pickerContext === "editor" && editorState) {
                  editorState.exercises.push({ exerciseId: ex.id, name: ex.name, category: ex.category, weight: ex.defaultWeight, sets: ex.defaultSets, reps: ex.defaultReps });
                  showToast(`Добавлено: ${ex.name}`); closeExercisePicker();
                } else if (pickerContext === "presetEditor" && presetEditorState) {
                  presetEditorState.exercises.push({ exerciseId: ex.id, name: ex.name, category: ex.category, weight: ex.defaultWeight, sets: ex.defaultSets, reps: ex.defaultReps });
                  showToast(`Добавлено в сет: ${ex.name}`); closeExercisePicker();
                }
              }
              function renderAll() {
                const main = document.getElementById("main-content");
                if (state.activeTab === "exercises") { state.activeTab = "workouts"; state.workoutsTab = "exercises"; }
                switch (state.activeTab) {
                  case "home": main.innerHTML = renderHome(); break;
                  case "workouts": main.innerHTML = renderWorkouts(); break;
                  case "calendar": main.innerHTML = renderCalendar(); break;
                  case "stats": main.innerHTML = renderStats(); break;
                  case "settings": main.innerHTML = renderSettings(); break;
                  default: main.innerHTML = renderHome();
                }
                renderTabBar(); renderActiveWorkoutUI();
              }
              function initApp() { loadState(); setupHorizontalScrollAndSwipes(); if (state.activeWorkout) startTimerTicker(); renderAll(); }
              if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", initApp); else initApp();
            </script>
          </body>
          </html>
          """
          write_file("app/src/main/assets/index.html", index_html)
          print("Gymbro Android project generated successfully!")
          '

      - name: Build Gymbro Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Gymbro-Build-1.0.apk

      - name: Upload Gymbro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gymbro-Build-1.0-APK
          path: Gymbro-Build-1.0.apk
          retention-days: 90
