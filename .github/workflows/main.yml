                --text-main: #fafafa;
                --text-muted: #a1a1aa;
                --text-dim: #71717a;
                --accent: #a3e635;
                --accent-hover: #bef264;
                --accent-contrast: #09090b;
                --accent-soft: rgba(163, 230, 53, 0.14);
                --accent-border: rgba(163, 230, 53, 0.36);
                --accent-grad-from: #a3e635;
                --accent-grad-to: #34d399;
                --accent-shadow: rgba(163, 230, 53, 0.22);
                --nav-bg: rgba(9, 9, 11, 0.92);
              }
              html[data-theme="neon"] {
                --bg-outer: #04030c;
                --bg-app: #070616;
                --bg-card: #111029;
                --bg-card-soft: #0c0b20;
                --bg-elevated: #1c1a42;
                --border-main: rgba(139, 92, 246, 0.34);
                --border-soft: rgba(56, 189, 248, 0.22);
                --text-main: #f5f3ff;
                --text-muted: #c4b5fd;
                --text-dim: #8b5cf6;
                --accent: #38bdf8;
