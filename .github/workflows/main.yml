              function buildPickerListHtml() {
                const q = pickerSearch.trim().toLowerCase();
                return EXERCISES_DB.filter(ex => { if (pickerCategory !== 'Все' && ex.category !== pickerCategory) return false; if (!q) return true; return ex.name.toLowerCase().includes(q) || ex.primaryMuscles.toLowerCase().includes(q); }).map(ex => `<button onclick="selectExerciseFromPicker('${ex.id}')" class="w-full p-3 rounded-2xl bg-[#18181b] hover:bg-zinc-900 border border-zinc-800 flex items-center justify-between gap-2.5 text-left active:scale-[0.99] transition"><div class="w-16 h-12 rounded-xl bg-zinc-900 border border-zinc-800 overflow-hidden shrink-0">${getExerciseIllustration(ex, false)}</div><div class="min-w-0 flex-1"><div class="text-xs font-extrabold text-white truncate">${escapeHtml(ex.name)}</div><div class="text-[10.5px] text-zinc-400 mt-0.5 truncate">${escapeHtml(ex.category)} • ${escapeHtml(ex.recommended)}</div></div><span class="w-8 h-8 rounded-xl bg-lime-400/15 text-lime-400 flex items-center justify-center shrink-0">${icon('plus', 'w-4 h-4')}</span></button>`).join('');
              }
              function selectExerciseFromPicker(exId) {
                const ex = getExerciseById(exId); if (!ex) return;
                if (pickerContext === 'active' && state.activeWorkout) { state.activeWorkout.exercises.push({ id: generateId('aw_ex'), exerciseId: ex.id, name: ex.name, category: ex.category, weight: ex.defaultWeight, sets: ex.defaultSets, reps: ex.defaultReps, done: false }); saveState(); showToast(`Добавлено: ${ex.name}`); closeExercisePicker(); }
                else if (pickerContext === 'editor' && editorState) { editorState.exercises.push({ exerciseId: ex.id, name: ex.name, category: ex.category, weight: ex.defaultWeight, sets: ex.defaultSets, reps: ex.defaultReps }); showToast(`Добавлено: ${ex.name}`); closeExercisePicker(); }
                else if (pickerContext === 'presetEditor' && presetEditorState) { presetEditorState.exercises.push({ exerciseId: ex.id, name: ex.name, category: ex.category, weight: ex.defaultWeight, sets: ex.defaultSets, reps: ex.defaultReps }); showToast(`Добавлено в сет: ${ex.name}`); closeExercisePicker(); }
              }

              function renderAll() {
                const main = document.getElementById('main-content');
                if (state.activeTab === 'exercises') { state.activeTab = 'workouts'; state.workoutsTab = 'exercises'; }
                switch (state.activeTab) {
                  case 'home': main.innerHTML = renderHome(); break;
                  case 'workouts': main.innerHTML = renderWorkouts(); break;
                  case 'calendar': main.innerHTML = renderCalendar(); break;
                  case 'stats': main.innerHTML = renderStats(); break;
                  case 'settings': main.innerHTML = renderSettings(); break;
                  default: main.innerHTML = renderHome();
                }
                renderTabBar(); renderActiveWorkoutUI();
              }
              function initApp() { loadState(); setupHorizontalScrollAndSwipes(); if (state.activeWorkout) startTimerTicker(); renderAll(); }
              if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', initApp); else initApp();
            </script>
          </body>
          </html>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Gymbro Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Gymbro-Build-1.0.apk

      - name: Upload Gymbro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gymbro-Build-1.0-APK
          path: Gymbro-Build-1.0.apk
          retention-days: 90
