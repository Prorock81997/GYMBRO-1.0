              function getExerciseMuscleZones(ex) {
                const cat = ex ? ex.category : 'Full Body';
                const byId = {
                  bench_press: { red: ['chest_front'], orange: ['front_delts', 'triceps_back'], yellow: ['abs_front', 'forearms_front'] },
                  incline_dumbbell_press: { red: ['chest_front'], orange: ['front_delts', 'triceps_back'], yellow: ['abs_front'] },
                  cable_crossover: { red: ['chest_front'], orange: ['front_delts'], yellow: ['biceps_front', 'abs_front'] },
                  pec_deck_fly: { red: ['chest_front'], orange: ['front_delts'], yellow: ['biceps_front'] },
                  lat_pulldown: { red: ['lats_back', 'upper_back'], orange: ['biceps_front', 'rear_delts'], yellow: ['forearms_front', 'forearms_back'] },
                  seated_cable_row: { red: ['upper_back', 'lats_back'], orange: ['rear_delts', 'biceps_front'], yellow: ['lower_back', 'forearms_back'] },
                  barbell_bent_row: { red: ['lats_back', 'upper_back'], orange: ['lower_back', 'rear_delts', 'biceps_front'], yellow: ['hamstrings_back', 'glutes_back', 'abs_front'] },
                  hyperextension: { red: ['lower_back'], orange: ['glutes_back', 'hamstrings_back'], yellow: ['upper_back', 'calves_back'] },
                  barbell_squat: { red: ['quads_front', 'glutes_back'], orange: ['hamstrings_back', 'lower_back'], yellow: ['abs_front', 'calves_back'] },
                  leg_press: { red: ['quads_front'], orange: ['glutes_back', 'hamstrings_back'], yellow: ['calves_back'] },
                  leg_extension: { red: ['quads_front'], orange: ['calves_front'], yellow: ['abs_front'] },
                  lying_leg_curl: { red: ['hamstrings_back'], orange: ['calves_back', 'glutes_back'], yellow: ['lower_back'] },
                  standing_calf_raise: { red: ['calves_back', 'calves_front'], orange: ['hamstrings_back'], yellow: ['quads_front', 'abs_front'] },
                  dumbbell_shoulder_press: { red: ['front_delts', 'side_delts'], orange: ['triceps_back', 'upper_back'], yellow: ['abs_front'] },
                  lateral_raises: { red: ['side_delts'], orange: ['front_delts', 'upper_back'], yellow: ['forearms_front'] },
                  reverse_pec_deck: { red: ['rear_delts'], orange: ['upper_back'], yellow: ['triceps_back', 'lats_back'] },
                  barbell_bicep_curl: { red: ['biceps_front'], orange: ['forearms_front'], yellow: ['front_delts', 'abs_front'] },
                  hammer_curls: { red: ['biceps_front', 'forearms_front'], orange: ['forearms_back'], yellow: ['front_delts'] },
                  tricep_pushdown: { red: ['triceps_back'], orange: ['forearms_back', 'front_delts'], yellow: ['abs_front', 'chest_front'] },
                  french_press: { red: ['triceps_back'], orange: ['forearms_back'], yellow: ['front_delts', 'chest_front'] },
                  hanging_leg_raises: { red: ['abs_front'], orange: ['quads_front', 'forearms_front'], yellow: ['lats_back', 'chest_front'] },
                  cable_crunch: { red: ['abs_front'], orange: ['chest_front'], yellow: ['lats_back', 'quads_front'] },
                  plank: { red: ['abs_front'], orange: ['lower_back', 'front_delts', 'glutes_back'], yellow: ['quads_front', 'chest_front'] },
                  deadlift_fullbody: { red: ['lower_back', 'glutes_back', 'hamstrings_back'], orange: ['quads_front', 'lats_back', 'upper_back'], yellow: ['forearms_front', 'forearms_back', 'abs_front'] },
                  barbell_thrusters: { red: ['quads_front', 'front_delts', 'side_delts'], orange: ['glutes_back', 'triceps_back', 'chest_front'], yellow: ['abs_front', 'calves_back'] },
                  kettlebell_swing: { red: ['glutes_back', 'hamstrings_back'], orange: ['lower_back', 'abs_front', 'front_delts'], yellow: ['upper_back', 'forearms_front'] },
                  burpee_jump: { red: ['quads_front', 'chest_front', 'abs_front'], orange: ['front_delts', 'triceps_back', 'glutes_back'], yellow: ['calves_back', 'hamstrings_back'] },
                  farmers_walk: { red: ['forearms_front', 'forearms_back', 'upper_back'], orange: ['abs_front', 'lower_back', 'glutes_back'], yellow: ['quads_front', 'calves_back', 'side_delts'] },
                  treadmill_run: { red: ['quads_front', 'hamstrings_back', 'calves_back'], orange: ['glutes_back', 'calves_front', 'abs_front'], yellow: ['lower_back', 'front_delts'] },
                  rowing_ergometer: { red: ['lats_back', 'upper_back', 'quads_front'], orange: ['biceps_front', 'hamstrings_back', 'glutes_back'], yellow: ['abs_front', 'lower_back', 'forearms_back'] },
                  elliptical_trainer: { red: ['quads_front', 'glutes_back'], orange: ['hamstrings_back', 'calves_back', 'front_delts'], yellow: ['abs_front', 'biceps_front', 'triceps_back'] },
                  assault_bike: { red: ['quads_front', 'front_delts', 'chest_front'], orange: ['hamstrings_back', 'triceps_back', 'lats_back'], yellow: ['calves_back', 'abs_front'] },
                  stair_climber: { red: ['glutes_back', 'quads_front'], orange: ['hamstrings_back', 'calves_back', 'calves_front'], yellow: ['abs_front', 'lower_back'] },
                  jump_rope: { red: ['calves_back', 'calves_front'], orange: ['quads_front', 'side_delts', 'forearms_front'], yellow: ['abs_front', 'hamstrings_back'] }
                };
                if (ex && byId[ex.id]) return byId[ex.id];
                const fallback = {
                  'Грудь': { red: ['chest_front'], orange: ['front_delts', 'triceps_back'], yellow: ['abs_front'] },
                  'Спина': { red: ['lats_back', 'upper_back'], orange: ['rear_delts', 'biceps_front'], yellow: ['lower_back'] },
                  'Ноги': { red: ['quads_front', 'glutes_back'], orange: ['hamstrings_back', 'calves_back'], yellow: ['abs_front'] },
                  'Плечи': { red: ['front_delts', 'side_delts'], orange: ['rear_delts', 'triceps_back'], yellow: ['upper_back'] },
                  'Руки': { red: ['biceps_front', 'triceps_back'], orange: ['forearms_front', 'forearms_back'], yellow: ['front_delts'] },
                  'Пресс': { red: ['abs_front'], orange: ['lower_back', 'quads_front'], yellow: ['chest_front'] },
                  'Full Body': { red: ['quads_front', 'glutes_back', 'lats_back'], orange: ['chest_front', 'front_delts', 'hamstrings_back'], yellow: ['abs_front', 'calves_back'] },
                  'Кардио': { red: ['quads_front', 'calves_back', 'hamstrings_back'], orange: ['glutes_back', 'abs_front'], yellow: ['front_delts', 'lower_back'] }
                };
                return fallback[cat] || fallback['Full Body'];
              }

