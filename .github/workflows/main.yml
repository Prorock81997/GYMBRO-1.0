              function switchWorkoutsTab(tab) { state.workoutsTab = tab === 'exercises' ? 'exercises' : 'programs'; renderAll(); }
              function renderWorkouts() {
                const planned = state.workouts.filter(w => w.status === 'planned').sort((a, b) => a.date.localeCompare(b.date));
                const recentCompleted = state.workouts.filter(w => w.status === 'completed').sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
                const aw = state.activeWorkout, isExercisesSub = state.workoutsTab === 'exercises';
                if (isExercisesSub) setTimeout(() => { const chipsEl = document.getElementById('exercises-categories-scroll'); if (chipsEl && state.exerciseChipsScroll > 0) chipsEl.scrollLeft = state.exerciseChipsScroll; }, 0);
                return `
                  <div class="px-4 pt-5 pb-4 space-y-4 animate-fade-in">
