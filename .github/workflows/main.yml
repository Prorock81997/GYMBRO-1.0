                      <button onclick="switchWorkoutsTab('exercises')" class="py-2.5 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition ${isExercisesSub ? 'bg-lime-400 text-zinc-950' : 'text-zinc-400 hover:text-white'}">${icon('book', 'w-4 h-4')}<span>Упражнения (${EXERCISES_DB.length})</span></button>
                    </div>
                    ${isExercisesSub ? `
                      <div class="space-y-4 animate-fade-in">
                        <div class="relative"><span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500">${icon('search', 'w-4 h-4')}</span><input type="text" value="${escapeHtml(state.exerciseSearch)}" oninput="updateExerciseSearch(this.value)" placeholder="Поиск по названию, мышцам или тренажёру..." class="w-full pl-10 pr-4 py-3 rounded-2xl bg-[#18181b] border border-zinc-800 focus:border-lime-400 focus:outline-none text-xs text-white placeholder-zinc-500" /></div>
                        <div id="exercises-categories-scroll" data-hscroll="true" onscroll="state.exerciseChipsScroll = this.scrollLeft" class="w-full max-w-full min-w-0 flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 select-none">${MUSCLE_CATEGORIES.map(cat => `<button type="button" onclick="setExerciseCategory('${cat}')" class="shrink-0 whitespace-nowrap px-3.5 py-2 rounded-2xl text-xs font-bold transition ${state.exerciseCategory === cat ? 'bg-lime-400 text-zinc-950' : 'bg-[#18181b] text-zinc-400 border border-zinc-800 hover:text-white'}">${cat}</button>`).join('')}</div>
                        <div id="exercises-catalog-list" class="space-y-2.5">${buildExercisesListHtml()}</div>
                      </div>
                    ` : `
                      <div class="space-y-5 animate-fade-in">
                        <button onclick="${aw ? 'maximizeActiveWorkout()' : 'startActiveWorkout()'}" class="w-full p-4 rounded-3xl bg-gradient-to-r from-lime-400 to-emerald-400 text-zinc-950 flex items-center justify-between gap-3 shadow-lg shadow-lime-400/20 active:scale-[0.98] transition text-left">
                          <div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-black/15 flex items-center justify-center shrink-0">${icon(aw ? 'clock' : 'play', 'w-5 h-5')}</div><div><div class="text-base font-black">${aw ? 'Открыть текущую тренировку' : 'Начать тренировку'}</div><div class="text-[11px] font-bold opacity-80">${aw ? 'Таймер уже запущен' : 'Живой таймер + выбор упражнений'}</div></div></div>
                          ${icon('chevronRight', 'w-5 h-5')}
                        </button>
                        ${planned.length > 0 ? `<div class="space-y-2.5"><div class="flex items-center justify-between px-1"><h2 class="text-xs font-extrabold uppercase tracking-wider text-blue-400">Запланированные (${planned.length})</h2><button onclick="switchTab('calendar')" class="text-[11px] font-semibold text-zinc-400 hover:text-white">В календарь →</button></div>${planned.map(w => `<div class="bg-[#18181b] border border-blue-500/25 rounded-2xl p-3.5"><div class="flex items-start justify-between gap-2 mb-2.5"><div class="min-w-0"><span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-500/15 text-blue-400 mb-1">${formatRelativeDate(w.date)}</span><div class="text-sm font-extrabold text-white truncate">${escapeHtml(w.name)}</div><div class="text-[11px] text-zinc-400">${w.exercises.length} упр. • ~${w.durationMinutes} мин</div></div><div class="flex items-center gap-1 shrink-0"><button onclick="openEditWorkoutModal('${w.id}')" class="p-1.5 rounded-xl bg-zinc-900 text-zinc-400 hover:text-white">${icon('edit', 'w-3.5 h-3.5')}</button><button onclick="confirmDeleteWorkout('${w.id}')" class="p-1.5 rounded-xl bg-zinc-900 text-zinc-400 hover:text-red-400">${icon('trash', 'w-3.5 h-3.5')}</button></div></div><div class="flex gap-2"><button onclick="startPlannedWorkout('${w.id}')" class="flex-1 py-2 rounded-xl bg-lime-400 text-zinc-950 text-xs font-extrabold flex items-center justify-center gap-1.5 active:scale-95 transition">${icon('play', 'w-3.5 h-3.5')}<span>Начать по таймеру</span></button><button onclick="markPlannedCompleted('${w.id}')" class="px-3 py-2 rounded-xl bg-zinc-800 text-emerald-400 text-xs font-bold active:scale-95 transition">${icon('check', 'w-4 h-4')}</button></div></div>`).join('')}</div>` : ''}
                        <div class="space-y-3">
                          <div class="flex items-center justify-between px-1"><div><h2 class="text-xs font-extrabold uppercase tracking-wider text-zinc-400">Сеты тренировок (${state.presets.length})</h2></div><button onclick="openPresetEditorModal()" class="px-3 py-1.5 rounded-xl bg-lime-400/15 border border-lime-400/35 text-lime-400 text-[11px] font-bold flex items-center gap-1 active:scale-95 transition">${icon('plus', 'w-3.5 h-3.5')}<span>Создать сет</span></button></div>
                          <div class="space-y-2.5">${state.presets.map(preset => { const style = PRESET_CATEGORY_STYLES[preset.category] || PRESET_CATEGORY_STYLES['Другое'], badgeCls = preset.badgeColor || style.badgeColor, exCount = Array.isArray(preset.exercises) ? preset.exercises.length : (preset.exerciseIds || []).length; return `<div onclick="openPresetModal('${preset.id}')" class="bg-[#18181b] hover:bg-zinc-900/90 border border-zinc-800/90 rounded-3xl p-4 cursor-pointer active:scale-[0.99] transition"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><div class="flex items-center gap-1.5 mb-1.5"><span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${badgeCls}">${escapeHtml(preset.category)}</span>${preset.isCustom ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-lime-400/15 text-lime-400">Мой сет</span>` : ''}</div><div class="text-sm font-extrabold text-white truncate">${escapeHtml(preset.name)}</div><div class="text-[11px] text-zinc-400 mt-0.5 line-clamp-1">${escapeHtml(preset.subtitle || '')}</div></div><div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()"><button onclick="openPresetEditorModal('${preset.id}')" class="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-lime-400 transition">${icon('edit', 'w-3.5 h-3.5')}</button><button onclick="launchPresetLive('${preset.id}')" class="p-2 rounded-xl bg-lime-400 text-zinc-950 font-bold active:scale-95 transition">${icon('play', 'w-3.5 h-3.5')}</button></div></div><div class="mt-3 pt-2.5 border-t border-zinc-800/70 flex items-center justify-between text-[11px] text-zinc-400"><span>${exCount} ${pluralize(exCount, 'упражнение', 'упражнения', 'упражнений')}</span><span>~${preset.estimatedMin} мин</span></div></div>`; }).join('')}</div>
                          <div class="pt-1 text-center"><button onclick="restoreDefaultPresets()" class="text-[11px] font-semibold text-zinc-500 hover:text-zinc-300 transition">Восстановить стандартные сеты</button></div>
                        </div>
                        ${recentCompleted.length > 0 ? `<div class="space-y-2.5 pt-1"><div class="flex items-center justify-between px-1"><h2 class="text-xs font-extrabold uppercase tracking-wider text-zinc-500">Недавние тренировки</h2><button onclick="switchTab('calendar')" class="text-[11px] font-semibold text-zinc-400 hover:text-white">Все в календаре</button></div>${recentCompleted.map(w => `<div class="bg-[#18181b]/80 border border-zinc-800/80 rounded-2xl p-3 flex items-center justify-between gap-2"><div class="min-w-0"><div class="text-xs font-bold text-white truncate">${escapeHtml(w.name)}</div><div class="text-[10px] text-zinc-400 mt-0.5">${formatRelativeDate(w.date)} • ${formatDuration(w.durationMinutes)} • ${w.exercises.length} упр.</div></div><span class="px-2.5 py-1 rounded-xl bg-emerald-500/15 text-emerald-400 text-[10px] font-bold shrink-0">Выполнено</span></div>`).join('')}</div>` : ''}
                      </div>
                    `}
                  </div>
                `;
              }

              function changeCalendarMonth(delta) { let m = state.calendarMonth + delta, y = state.calendarYear; if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; } state.calendarMonth = m; state.calendarYear = y; renderAll(); }
              function renderCalendar() {
                const y = state.calendarYear, m = state.calendarMonth, todayKey = getTodayKey();
                const firstDay = new Date(y, m, 1), daysInMonth = new Date(y, m + 1, 0).getDate(), startWeekday = (firstDay.getDay() + 6) % 7;
                const byDate = {}; state.workouts.forEach(w => { if (!byDate[w.date]) byDate[w.date] = []; byDate[w.date].push(w); });
                let visitedCount = 0, missedCount = 0, plannedCount = 0;
                for (let day = 1; day <= daysInMonth; day++) {
                  const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`, list = byDate[key] || [];
                  if (list.some(w => w.status === 'completed')) visitedCount++;
                  else if (list.some(w => w.status === 'planned')) plannedCount++;
                  else if (key < todayKey) missedCount++;
                }
                let cellsHtml = ''; for (let i = 0; i < startWeekday; i++) cellsHtml += `<div class="aspect-square"></div>`;
                for (let day = 1; day <= daysInMonth; day++) {
                  const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`, list = byDate[key] || [];
                  const hasCompleted = list.some(w => w.status === 'completed'), hasPlanned = list.some(w => w.status === 'planned'), isToday = key === todayKey, isSelected = key === state.selectedDate, isPast = key < todayKey;
                  let cellBg = 'bg-[#18181b]/70 border-zinc-800/70 text-zinc-300', dotHtml = '';
                  if (hasCompleted) { cellBg = 'bg-emerald-500/20 border-emerald-500/45 text-emerald-300 font-extrabold'; dotHtml = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>`; }
                  else if (hasPlanned) { cellBg = 'bg-blue-500/20 border-blue-500/45 text-blue-300 font-extrabold'; dotHtml = `<span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>`; }
                  else if (isPast) { cellBg = 'bg-red-500/10 border-red-500/20 text-zinc-500'; dotHtml = `<span class="w-1 h-1 rounded-full bg-red-400/50"></span>`; }
                  const ringCls = isSelected ? 'ring-2 ring-lime-400 ring-offset-2 ring-offset-[#09090b]' : isToday ? 'ring-1 ring-white/60' : '';
                  cellsHtml += `<button onclick="selectCalendarDate('${key}')" class="aspect-square rounded-2xl border flex flex-col items-center justify-center gap-1 text-xs transition active:scale-90 ${cellBg} ${ringCls}"><span>${day}</span><div class="h-1.5 flex items-center justify-center">${dotHtml}</div></button>`;
                }
                const selWorkouts = byDate[state.selectedDate] || [];
                return `
                  <div class="px-4 pt-5 pb-4 space-y-4 animate-fade-in">
                    <div class="flex items-center justify-between"><div><h1 class="text-xl font-black text-white">Календарь</h1><p class="text-xs text-zinc-400 mt-0.5">Нажмите на день, чтобы посмотреть или добавить</p></div><button onclick="jumpToToday()" class="px-3 py-1.5 rounded-xl bg-[#18181b] hover:bg-zinc-800 border border-zinc-800 text-[11px] font-bold text-lime-400">Сегодня</button></div>
                    <div class="bg-[#18181b] border border-zinc-800/90 rounded-3xl p-4">
                      <div class="flex items-center justify-between mb-4"><button onclick="changeCalendarMonth(-1)" class="w-9 h-9 rounded-2xl bg-zinc-900 hover:bg-zinc-800 flex items-center justify-center text-zinc-300 active:scale-90 transition">${icon('chevronLeft', 'w-4 h-4')}</button><div class="text-sm font-black text-white">${MONTHS_RU[m]} ${y}</div><button onclick="changeCalendarMonth(1)" class="w-9 h-9 rounded-2xl bg-zinc-900 hover:bg-zinc-800 flex items-center justify-center text-zinc-300 active:scale-90 transition">${icon('chevronRight', 'w-4 h-4')}</button></div>
                      <div class="grid grid-cols-7 gap-1.5 text-center mb-2">${WEEKDAYS_SHORT_RU.map(d => `<div class="text-[10px] font-bold uppercase text-zinc-500">${d}</div>`).join('')}</div>
                      <div class="grid grid-cols-7 gap-1.5">${cellsHtml}</div>
                      <div class="mt-4 pt-3 border-t border-zinc-800/80 flex flex-wrap items-center justify-between gap-2 text-[10.5px] text-zinc-400"><div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span>В зале (${visitedCount})</span></div><div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-400"></span><span>План (${plannedCount})</span></div><div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-400/60"></span><span>Без зала (${missedCount})</span></div></div>
                    </div>
