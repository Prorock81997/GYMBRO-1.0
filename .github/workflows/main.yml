              html[data-theme="neon"] .bg-\[\#09090b\], html[data-theme="asiimov"] .bg-\[\#09090b\], html[data-theme="monochrome"] .bg-\[\#09090b\] { background-color: var(--bg-app) !important; }
              html[data-theme="neon"] .bg-\[\#18181b\], html[data-theme="neon"] .bg-\[\#18181b\]\/80, html[data-theme="asiimov"] .bg-\[\#18181b\], html[data-theme="asiimov"] .bg-\[\#18181b\]\/80, html[data-theme="monochrome"] .bg-\[\#18181b\], html[data-theme="monochrome"] .bg-\[\#18181b\]\/80 { background-color: var(--bg-card) !important; }
              html[data-theme="neon"] .bg-\[\#121215\], html[data-theme="asiimov"] .bg-\[\#121215\], html[data-theme="monochrome"] .bg-\[\#121215\] { background-color: var(--bg-card-soft) !important; }
              html[data-theme="neon"] .bg-zinc-900, html[data-theme="neon"] .bg-zinc-900\/90, html[data-theme="neon"] .bg-zinc-900\/80, html[data-theme="asiimov"] .bg-zinc-900, html[data-theme="asiimov"] .bg-zinc-900\/90, html[data-theme="asiimov"] .bg-zinc-900\/80, html[data-theme="monochrome"] .bg-zinc-900, html[data-theme="monochrome"] .bg-zinc-900\/90, html[data-theme="monochrome"] .bg-zinc-900\/80 { background-color: var(--bg-elevated) !important; }
              html[data-theme="neon"] .bg-zinc-950, html[data-theme="asiimov"] .bg-zinc-950, html[data-theme="monochrome"] .bg-zinc-950 { background-color: var(--bg-app) !important; }
              html[data-theme="neon"] .border-zinc-800, html[data-theme="neon"] .border-zinc-800\/90, html[data-theme="neon"] .border-zinc-800\/80, html[data-theme="asiimov"] .border-zinc-800, html[data-theme="asiimov"] .border-zinc-800\/90, html[data-theme="asiimov"] .border-zinc-800\/80, html[data-theme="monochrome"] .border-zinc-800, html[data-theme="monochrome"] .border-zinc-800\/90, html[data-theme="monochrome"] .border-zinc-800\/80 { border-color: var(--border-main) !important; }
              html[data-theme="neon"] .text-lime-400, html[data-theme="asiimov"] .text-lime-400, html[data-theme="monochrome"] .text-lime-400 { color: var(--accent) !important; }
              html[data-theme="neon"] .bg-lime-400, html[data-theme="asiimov"] .bg-lime-400, html[data-theme="monochrome"] .bg-lime-400 { background-color: var(--accent) !important; color: var(--accent-contrast) !important; }
              html[data-theme="neon"] .hover\:bg-lime-300:hover, html[data-theme="asiimov"] .hover\:bg-lime-300:hover, html[data-theme="monochrome"] .hover\:bg-lime-300:hover { background-color: var(--accent-hover) !important; }
              html[data-theme="neon"] .bg-lime-400\/15, html[data-theme="neon"] .bg-lime-400\/10, html[data-theme="asiimov"] .bg-lime-400\/15, html[data-theme="asiimov"] .bg-lime-400\/10, html[data-theme="monochrome"] .bg-lime-400\/15, html[data-theme="monochrome"] .bg-lime-400\/10 { background-color: var(--accent-soft) !important; }
              html[data-theme="neon"] .border-lime-400\/30, html[data-theme="neon"] .border-lime-400\/35, html[data-theme="neon"] .border-lime-400\/40, html[data-theme="neon"] .border-lime-400, html[data-theme="asiimov"] .border-lime-400\/30, html[data-theme="asiimov"] .border-lime-400\/35, html[data-theme="asiimov"] .border-lime-400\/40, html[data-theme="asiimov"] .border-lime-400, html[data-theme="monochrome"] .border-lime-400\/30, html[data-theme="monochrome"] .border-lime-400\/35, html[data-theme="monochrome"] .border-lime-400\/40, html[data-theme="monochrome"] .border-lime-400 { border-color: var(--accent-border) !important; }
              html[data-theme="neon"] .from-lime-400.to-emerald-400, html[data-theme="asiimov"] .from-lime-400.to-emerald-400, html[data-theme="monochrome"] .from-lime-400.to-emerald-400 { background-image: linear-gradient(135deg, var(--accent-grad-from), var(--accent-grad-to)) !important; color: var(--accent-contrast) !important; box-shadow: 0 10px 25px -5px var(--accent-shadow) !important; }
              html[data-theme="asiimov"] .asiimov-stripe { background: repeating-linear-gradient(-45deg, #ff6b00, #ff6b00 8px, #ffffff 8px, #ffffff 16px, #18181b 16px, #18181b 24px); }
