              <div id="toast-root" class="pointer-events-none fixed top-4 left-1/2 -translate-x-1/2 z-[60] w-[92%] max-w-[420px] flex flex-col gap-2"></div>
            </div>
            <script>
              const MONTHS_RU = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
              const MONTHS_GENITIVE_RU = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
              const WEEKDAYS_SHORT_RU = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
              function toDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
              function parseDateKey(k) { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
              function getTodayKey() { return toDateKey(new Date()); }
              function formatHumanDate(k) { const d = parseDateKey(k); return `${d.getDate()} ${MONTHS_GENITIVE_RU[d.getMonth()]} ${d.getFullYear()}`; }
              function formatRelativeDate(k) {
                const tk = getTodayKey(); if (k === tk) return "Сегодня";
                const diff = Math.round((parseDateKey(k) - parseDateKey(tk)) / 86400000);
                if (diff === -1) return "Вчера"; if (diff === 1) return "Завтра";
                const t = parseDateKey(k); return `${t.getDate()} ${MONTHS_GENITIVE_RU[t.getMonth()]}`;
              }
              function formatDuration(m) {
                const mins = Math.max(0, Math.round(Number(m) || 0));
                if (mins < 60) return `${mins} мин`;
                const h = Math.floor(mins / 60), r = mins % 60;
                return r === 0 ? `${h} ч` : `${h} ч ${r} мин`;
              }
              function formatTimerSeconds(s) {
                const v = Math.max(0, Math.floor(s));
                return `${String(Math.floor(v/3600)).padStart(2,"0")}:${String(Math.floor((v%3600)/60)).padStart(2,"0")}:${String(v%60).padStart(2,"0")}`;
              }
              function pluralize(n, one, few, many) {
                const abs = Math.abs(n) % 100, n1 = abs % 10;
                if (abs > 10 && abs < 20) return many;
                if (n1 > 1 && n1 < 5) return few;
                if (n1 === 1) return one;
                return many;
              }
              function escapeHtml(str) {
                if (str === null || str === undefined) return "";
                return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/\x27/g,"&#39;");
              }
              function generateId(p = "id") { return `${p}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`; }
              function icon(name, cls = "w-5 h-5") {
